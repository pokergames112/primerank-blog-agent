services:
  - type: web
    name: primerank-blog-agent
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: AUTO_DISCOVER_TRENDS
        value: true
      - key: CRON_SCHEDULE
        value: "0 8 * * *"
